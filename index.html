<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Srikar Mattegunta's personal page.">
    <title>Srikar Mattegunta</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: #eff6ff;
        color: #172554;
        font-family: system-ui, sans-serif;
      }
      main { width: 100%; max-width: 42rem; }
      h1 {
        margin: 0 0 1rem;
        color: #1d4ed8;
        font-size: clamp(2.5rem, 8vw, 4.5rem);
        line-height: 1.1;
        overflow-wrap: anywhere;
      }
      p { margin: 0; font-size: 1.25rem; line-height: 1.6; }
    </style>
  </head>
  <body>
    <main>
      <h1>Srikar Mattegunta</h1>
      <p>I like the color blue.</p>
    </main>
  </body>
</html>
